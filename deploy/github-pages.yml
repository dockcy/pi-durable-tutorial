# 把整个仓库作为静态网站发布到 GitHub Pages。
# 使用前：仓库 Settings → Pages → Source 选 “GitHub Actions”。
name: 发布网页版教程

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 准备站点文件
        run: |
          mkdir -p _site
          cp -r index.html assets course labs README.md _site/
          if [ -d film ]; then cp -r film _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
